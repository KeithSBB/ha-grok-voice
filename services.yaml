    invert:
      name: Invert
      selector:
        boolean:
    enabled:
      name: Enabled
      selector:
        boolean:

remove_modulator:
  name: Remove personality modulator
  description: Remove a modulator by id (or by entity_id if id omitted).
  fields:
    id:
      name: Modulator ID
      selector:
        text:
    entity_id:
      name: Sensor
      selector:
        entity:
          domain: sensor

set_modulator_enabled:
  name: Enable/disable personality modulator
  description: Toggle a modulator without changing other fields.
  fields:
    id:
      name: Modulator ID
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean: